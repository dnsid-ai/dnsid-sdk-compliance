# Agent FQDN normalization: IDNA A-label form, lowercase, exactly one trailing
# dot stripped, 63-octet label limit, 246-octet total limit (DNSid agent limit).
# Error cases require a native validation error, not an unexpected exception.
suite: fqdn
cases:
  - id: fqdn-passthrough
    description: Already-normalized name is unchanged
    spec_ref: "draft-ihsanullah-dnsid-01 §Owner Name Convention"
    tags: [happy-path]
    op: normalize_fqdn
    input:
      name: example.com
    expect:
      ok: true
      value: example.com

  - id: fqdn-uppercase
    description: ASCII names are lowercased
    spec_ref: "draft-ihsanullah-dnsid-01 §GI Tag (lowercase ASCII)"
    tags: [required]
    op: normalize_fqdn
    input:
      name: EXAMPLE.COM
    expect:
      ok: true
      value: example.com

  - id: fqdn-trailing-dot
    description: Exactly one trailing root dot is stripped
    spec_ref: "draft-ihsanullah-dnsid-01 §Owner Name Convention"
    tags: [required]
    op: normalize_fqdn
    input:
      name: example.com.
    expect:
      ok: true
      value: example.com

  - id: fqdn-double-trailing-dot
    description: Two trailing dots are invalid (only one root dot may be stripped)
    spec_ref: "draft-ihsanullah-dnsid-01 §Owner Name Convention"
    tags: [edge-case, security]
    op: normalize_fqdn
    input:
      name: example.com..
    expect:
      ok: false
      error: ValidationError

  - id: fqdn-idn-unicode
    description: IDN U-labels convert to lowercase A-label (punycode) form
    spec_ref: "draft-ihsanullah-dnsid-01 §GI Tag (lowercase A-label form, RFC 5890)"
    tags: [required, idn]
    op: normalize_fqdn
    input:
      name: "München.de"
    expect:
      ok: true
      value: xn--mnchen-3ya.de

  - id: fqdn-ideographic-full-stop
    description: U+3002 ideographic full stop is treated as a label separator by IDNA
    spec_ref: "RFC 5895 / UTS46 mapping"
    tags: [edge-case, idn]
    op: normalize_fqdn
    input:
      name: "example.com。"
    expect:
      ok: true
      value: example.com

  - id: fqdn-63-octet-label
    description: A 63-octet label is the maximum and is accepted
    spec_ref: "RFC 1035 §2.3.4"
    tags: [edge-case]
    op: normalize_fqdn
    input:
      name: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.test"
    expect:
      ok: true
      value: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.test"

  - id: fqdn-64-octet-label
    description: A 64-octet label exceeds the DNS label limit
    spec_ref: "RFC 1035 §2.3.4"
    tags: [edge-case]
    op: normalize_fqdn
    input:
      name: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.test"
    expect:
      ok: false
      error: ValidationError

  - id: fqdn-246-octets-exact
    description: A 246-octet agent FQDN is exactly at the DNSid limit and is accepted
    spec_ref: "draft-ihsanullah-dnsid-01 §Owner Name Convention (MUST NOT exceed 246 octets)"
    tags: [edge-case]
    op: normalize_fqdn
    input:
      name: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    expect:
      ok: true
      value: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"

  - id: fqdn-247-octets
    description: A 247-octet agent FQDN exceeds the DNSid limit
    spec_ref: "draft-ihsanullah-dnsid-01 §Owner Name Convention (MUST NOT exceed 246 octets)"
    tags: [required, edge-case]
    op: normalize_fqdn
    input:
      name: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    expect:
      ok: false
      error: ValidationError

  - id: fqdn-leading-hyphen-label
    description: A label starting with a hyphen violates LDH rules (RFC 5890)
    spec_ref: "RFC 5890 §2.3.1 (LDH label)"
    tags: [edge-case, security]
    op: normalize_fqdn
    input:
      name: "-foo.test"
    expect:
      ok: false
      error: ValidationError

  - id: fqdn-empty
    description: Empty input is rejected
    spec_ref: "draft-ihsanullah-dnsid-01 §Owner Name Convention"
    tags: [edge-case]
    op: normalize_fqdn
    input:
      name: ""
    expect:
      ok: false
      error: ValidationError

  - id: fqdn-uppercase-final-sigma
    description: UTS 46 maps U+03A3 to U+03C3 in every position; a final-sigma lowercase step gives a different A-label
    spec_ref: "SDK design 07 NormalizeFQDN (IDNA.ToASCII before lowercasing); UTS 46 mapping table"
    tags: [idn, edge-case]
    op: normalize_fqdn
    input:
      name: "ΒΌΛΟΣ.com"
    expect:
      ok: true
      value: xn--nxasmq6b.com

  - id: fqdn-reserved-hyphen-label-rejected
    description: "\"--\" in positions 3-4 is reserved for A-labels (xn--); ab--c is not a valid label"
    spec_ref: "SDK design 07 NormalizeFQDN (validate DNS label constraints); RFC 5891 §4.2.3.1; UTS 46 CheckHyphens"
    tags: [idn, edge-case]
    op: normalize_fqdn
    input:
      name: ab--c.example
    expect:
      ok: false
      error: ValidationError

  - id: fqdn-underscore-label-rejected
    description: An agent FQDN is a host name; host-name labels are letters, digits and hyphens
    spec_ref: "SDK design 07 NormalizeFQDN (validate DNS label constraints); RFC 5890 §2.3.1 LDH label; UTS 46 UseSTD3ASCIIRules"
    tags: [edge-case]
    op: normalize_fqdn
    input:
      name: a_b.example
    expect:
      ok: false
      error: ValidationError

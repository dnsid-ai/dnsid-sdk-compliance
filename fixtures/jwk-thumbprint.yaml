# RFC 7638 SHA-256 thumbprints for DNSid's supported public-key types.
# Expected values are committed known answers, not generated by
# the harness. Repeating the Ed25519 material with different optional metadata
# proves kid/alg/use are excluded from the thumbprint input.
suite: jwk-thumbprint
cases:
  - id: thumbprint-ec-p256-known-answer
    description: P-256 public key produces the committed RFC 7638 thumbprint
    spec_ref: "RFC 7638 §3; sdk-design/07-protocol-data-types.md §JWKS"
    tags: [required, security]
    op: jwk_thumbprint
    input:
      jwk:
        kty: EC
        crv: P-256
        x: f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU
        y: x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0
        kid: ec-p256
        alg: ES256
    expect:
      ok: true
      value: oKIywvGUpTVTyxMQ3bwIIeQUudfr_CkLMjCE19ECD-U

  - id: thumbprint-ed25519-known-answer
    description: Ed25519 public key produces the committed RFC 7638 thumbprint
    spec_ref: "RFC 7638 §3; sdk-design/07-protocol-data-types.md §JWKS"
    tags: [required, security]
    op: jwk_thumbprint
    input:
      jwk:
        kty: OKP
        crv: Ed25519
        x: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo
        kid: ed-1
        alg: EdDSA
    expect:
      ok: true
      value: kPrK_qmxVWaYVA9wwBF6Iuo3vVzz7TxHCTwXBygrS4k

  - id: thumbprint-ed25519-with-extra-metadata
    description: Optional kid, alg, and use metadata do not change a thumbprint
    spec_ref: "RFC 7638 §3.2"
    tags: [required, edge-case]
    op: jwk_thumbprint
    input:
      jwk:
        kty: OKP
        crv: Ed25519
        x: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo
        kid: renamed-key
        alg: EdDSA
        use: sig
    expect:
      ok: true
      value: kPrK_qmxVWaYVA9wwBF6Iuo3vVzz7TxHCTwXBygrS4k

  - id: thumbprint-ed25519-without-extra-metadata
    description: The same Ed25519 material without optional metadata has the same thumbprint
    spec_ref: "RFC 7638 §3.2"
    tags: [required, edge-case]
    op: jwk_thumbprint
    input:
      jwk:
        kty: OKP
        crv: Ed25519
        x: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo
    expect:
      ok: true
      value: kPrK_qmxVWaYVA9wwBF6Iuo3vVzz7TxHCTwXBygrS4k

name: Cross-SDK Compliance

# Validates this repository's canonical fixtures and harness against all SDK
# main branches. SDK repositories use sdk-compliance.yaml separately to test
# individual pull requests against their base revisions.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # daily against SDK main branches
  push:
    branches: [main]
  pull_request:

concurrency:
  group: cross-sdk-compliance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out compliance kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out dnsid-go
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dnsid-ai/dnsid-go
          persist-credentials: false
          path: sdks/dnsid-go

      - name: Check out dnsid-ts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dnsid-ai/dnsid-ts
          persist-credentials: false
          path: sdks/dnsid-ts

      - name: Check out dnsid-py
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dnsid-ai/dnsid-py
          persist-credentials: false
          path: sdks/dnsid-py

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Run compliance suite and C2SP matrix
        run: |
          make run c2sp-matrix \
            DNSID_GO_DIR="$GITHUB_WORKSPACE/sdks/dnsid-go" \
            DNSID_TS_DIR="$GITHUB_WORKSPACE/sdks/dnsid-ts" \
            DNSID_PY_DIR="$GITHUB_WORKSPACE/sdks/dnsid-py"

      - name: Publish report to job summary
        if: always()
        run: |
          if [ -f report.md ]; then
            cat report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No report generated — the job failed before the harness ran._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload compliance report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: compliance-report
          path: report.md
          if-no-files-found: ignore
